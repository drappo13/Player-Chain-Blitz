name: End-to-end (emulator)
# Guest play, picking a name, leaderboards, rules and /stats against a local Firestore emulator.
# Never touches production. Runs on every branch except main, and on demand.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
        env:
          VITE_EMULATOR: "1"
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: npx -y firebase-tools@13.29.1 emulators:exec --only firestore --project drapk-in "node scripts/e2e/guest-flow.mjs"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: shots
